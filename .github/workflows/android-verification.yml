name: Android verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the hosted runner Android SDK
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          fi
      - name: Compile, test, package, and lint
        run: sh ./gradlew --no-daemon --console=plain --stacktrace --continue :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
