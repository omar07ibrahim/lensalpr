name: Android verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure the runner SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Compile, test, package, and lint
        run: sh ./gradlew --no-daemon --console=plain --stacktrace --continue :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
